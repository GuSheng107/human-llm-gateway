<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- 外围网关环（human-in-the-loop），断口在底部 -->
  <path d="M60 22 a38 38 0 1 0 0.01 0" fill="none" stroke="#ffffff" stroke-width="5"
        stroke-dasharray="168 70" stroke-dashoffset="-84"/>
  <!-- 环上的两个端点：入口与出口 -->
  <circle cx="60" cy="22" r="5" fill="#ffffff"/>
  <circle cx="60" cy="98" r="5" fill="#ffffff" opacity="0.9"/>
  <!-- 中心人形 -->
  <circle cx="60" cy="52" r="11" fill="#ffffff"/>
  <path d="M44 84 a16 22 0 0 1 32 0 z" fill="#ffffff"/>
  <!-- 顶部入口到人的引导线 -->
  <path d="M60 27 L60 40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
